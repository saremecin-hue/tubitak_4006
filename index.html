<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Edebi Diyalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HOME -->
<section id="home" class="page active">
  <div class="star">
    <h1>Edebi Diyalog<br>Oluşturucu</h1>
  </div>

  <div class="home-buttons">
    <button class="oval-btn" data-target="themePage">Temasına Göre</button>
    <button class="oval-btn" data-target="eraPage">Dönemine Göre</button>
  </div>
</section>


<!-- THEME PAGE -->
<section id="themePage" class="page">
  <div class="oval-title">Temasına Göre</div>

  <select id="themeSelect" class="select-box">
    <option>Özgürlük</option>
    <option>Ahlak ve Vicdan</option>
    <option>Vatanseverlik ve Sorumluluk</option>
    <option>İnsan-Toplum Çatışması</option>
    <option>Gelenek ve Modernleşme</option>
    <option>Kader ve İrade</option>
    <option>Ölüm ve Yaşam</option>
    <option>Adalet ve Eşitlik</option>
    <option>Aşk ve Bağlılık</option>
    <option>Sevgi ve Nefret</option>
    <option>Yalnızlık ve İç Hesaplaşma</option>
  </select>

  <button class="diamond-btn" id="generateTheme">Metin Oluştur</button>
</section>


<!-- ERA PAGE -->
<section id="eraPage" class="page">
  <div class="oval-title">Dönemine Göre</div>

  <select id="era1" class="select-box">
    <option>İslamiyet Öncesi</option>
    <option>Geçiş Dönemi</option>
    <option>Halk Edebiyatı</option>
    <option>Divan Edebiyatı</option>
    <option>Tanzimat</option>
    <option>Servet-i Fünun</option>
    <option>Milli Edebiyat</option>
  </select>

  <select id="era2" class="select-box">
    <option>İslamiyet Öncesi</option>
    <option>Geçiş Dönemi</option>
    <option>Halk Edebiyatı</option>
    <option>Divan Edebiyatı</option>
    <option>Tanzimat</option>
    <option>Servet-i Fünun</option>
    <option>Milli Edebiyat</option>
  </select>

  <button class="diamond-btn" id="generateEra">Metin Oluştur</button>
</section>


<!-- RESULT PAGE -->
<section id="resultPage" class="page">

  <div class="dialogue-container">
    <div class="character left">
      <div class="avatar"></div>
      <div class="speech" id="speechLeft"></div>
    </div>

    <div class="character right">
      <div class="avatar"></div>
      <div class="speech" id="speechRight"></div>
    </div>
  </div>

  <div class="analysis" id="analysisText"></div>

  <button class="oval-btn" data-target="home">Ana Sayfa</button>

</section>

<script src="script.js"></script>
</body>
</html>
